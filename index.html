<!doctype html>

    <meta charset="UTF-8" />
    <script>
      (function () {
        var EXT_RE = /^(chrome|moz|safari-web)-extension:\/\/|chrome-extension:\/\//i;
        function isExtensionCrossFrameError(filename, message, stack) {
          if (filename && EXT_RE.test(filename)) return true;
          if (stack && EXT_RE.test(stack)) return true;
          if (
            message &&
            message.indexOf('Blocked a frame with origin') !== -1 &&
            message.indexOf('Location') !== -1
          ) {
            return true;
          }
          return false;
        }
        window.addEventListener(
          'error',
          function (e) {
            var stack = e.error && typeof e.error.stack === 'string' ? e.error.stack : '';
            if (isExtensionCrossFrameError(e.filename || '', e.message || '', stack)) {
              e.stopImmediatePropagation();
              e.preventDefault();
            }
          },
          true
        );
        window.addEventListener(
          'unhandledrejection',
          function (e) {
            var reason = e.reason;
            var msg = reason && reason.message ? String(reason.message) : String(reason || '');
            var stack = reason && typeof reason.stack === 'string' ? reason.stack : '';
            if (isExtensionCrossFrameError('', msg, stack)) {
              e.stopImmediatePropagation();
              e.preventDefault();
            }
          },
          true
        );
      })();
    </script>
